[project]
name = "primitive-db"
version = "0.1.0"
description = "Консольная СУБД на JSON-файлах: таблицы, CRUD-операции и SQL-подобные команды"
readme = "README.md"
authors = [
    { name = "Radif Ilaltdinov", email = "i@radif.ru" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
primitive-db = "primitive_db:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
