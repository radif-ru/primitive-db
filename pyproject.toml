[project]
name = "primitive-db"
version = "0.1.0"
description = "Консольная СУБД на JSON-файлах: таблицы, CRUD-операции и SQL-подобные команды"
readme = "README.md"
authors = [
    { name = "Radif Ilaltdinov", email = "i@radif.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
